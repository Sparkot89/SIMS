<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMS - Barras de Necesidades</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <div class="needs-panel">
            <!-- <h2 class="title">Estado del Personaje</h2> -->
            <img class="gema" src="img/plumb.png" alt="gema">
            <div class="need-item" id="need-item-diversion" data-need="diversion">
                <div class="need-icon" id="icon-diversion"><img class="img" src="img/Fun.png" alt="Diversión"></div>
                <div class="need-info">
                    <div class="need-label">Diversión</div>
                    <div class="need-bar-container">
                        <div class="need-bar" id="bar-diversion"></div>
                    </div>
                </div>
            </div>

            <div class="need-item" id="need-item-hambre" data-need="hambre">
                <div class="need-icon" id="icon-hambre"><img class="img" src="img/Hungry.png" alt="Hambre"></div>
                <div class="need-info">
                    <div class="need-label">Hambre</div>
                    <div class="need-bar-container">
                        <div class="need-bar" id="bar-hambre"></div>
                    </div>
                </div>
            </div>

            <div class="need-item" id="need-item-energia" data-need="energia">
                <div class="need-icon" id="icon-energia"><img class="img" src="img/Energy.png" alt="Energía"></div>
                <div class="need-info">
                    <div class="need-label">Energía</div>
                    <div class="need-bar-container">
                        <div class="need-bar" id="bar-energia"></div>
                    </div>
                </div>
            </div>



            <div class="need-item" id="need-item-social" data-need="social">
                <div class="need-icon" id="icon-social"><img class="img" src="img/Social.png" alt="Social"></div>
                <div class="need-info">
                    <div class="need-label">Social</div>
                    <div class="need-bar-container">
                        <div class="need-bar" id="bar-social"></div>
                    </div>
                </div>
            </div>

            <div class="need-item" id="need-item-higiene" data-need="higiene">
                <div class="need-icon" id="icon-higiene"><img class="img" src="img/Hygiene.png" alt="Higiene"></div>
                <div class="need-info">
                    <div class="need-label">Higiene</div>
                    <div class="need-bar-container">
                        <div class="need-bar" id="bar-higiene"></div>
                    </div>
                </div>
            </div>

            <div class="need-item" id="need-item-mental" data-need="mental">
                <div class="need-icon" id="icon-mental"><img class="img" src="img/Mental.png" alt="Mental"></div>
                <div class="need-info">
                    <div class="need-label">Mental</div>
                    <div class="need-bar-container">
                        <div class="need-bar" id="bar-mental"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
