<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMS - Barras de Necesidades</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="needs-panel">
            <h2 class="title">Estado del Personaje</h2>
            
            <div class="need-item" data-need="hambre">
                <div class="need-icon">🍔</div>
                <div class="need-info">
                    <div class="need-label">Hambre</div>
                    <div class="need-bar-container">
                        <div class="need-bar" id="bar-hambre"></div>
                    </div>
                </div>
                <div class="need-value" id="value-hambre">100%</div>
            </div>

            <div class="need-item" data-need="energia">
                <div class="need-icon">⚡</div>
                <div class="need-info">
                    <div class="need-label">Energía</div>
                    <div class="need-bar-container">
                        <div class="need-bar" id="bar-energia"></div>
                    </div>
                </div>
                <div class="need-value" id="value-energia">100%</div>
            </div>

            <div class="need-item" data-need="diversion">
                <div class="need-icon">🎮</div>
                <div class="need-info">
                    <div class="need-label">Diversión</div>
                    <div class="need-bar-container">
                        <div class="need-bar" id="bar-diversion"></div>
                    </div>
                </div>
                <div class="need-value" id="value-diversion">100%</div>
            </div>

            <div class="need-item" data-need="social">
                <div class="need-icon">👥</div>
                <div class="need-info">
                    <div class="need-label">Social</div>
                    <div class="need-bar-container">
                        <div class="need-bar" id="bar-social"></div>
                    </div>
                </div>
                <div class="need-value" id="value-social">100%</div>
            </div>

            <div class="need-item" data-need="higiene">
                <div class="need-icon">🚿</div>
                <div class="need-info">
                    <div class="need-label">Higiene</div>
                    <div class="need-bar-container">
                        <div class="need-bar" id="bar-higiene"></div>
                    </div>
                </div>
                <div class="need-value" id="value-higiene">100%</div>
            </div>

            <div class="need-item" data-need="focus">
                <div class="need-icon">🚽</div>
                <div class="need-info">
                    <div class="need-label">Focus</div>
                    <div class="need-bar-container">
                        <div class="need-bar" id="bar-focus"></div>
                    </div>
                </div>
                <div class="need-value" id="value-focus">100%</div>
            </div>

            <div class="need-item" data-need="ambiente">
                <div class="need-icon">🏠</div>
                <div class="need-info">
                    <div class="need-label">Ambiente</div>
                    <div class="need-bar-container">
                        <div class="need-bar" id="bar-ambiente"></div>
                    </div>
                </div>
                <div class="need-value" id="value-ambiente">100%</div>
            </div>

            <div class="need-item" data-need="confort">
                <div class="need-icon">🛋️</div>
                <div class="need-info">
                    <div class="need-label">Confort</div>
                    <div class="need-bar-container">
                        <div class="need-bar" id="bar-confort"></div>
                    </div>
                </div>
                <div class="need-value" id="value-confort">100%</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
