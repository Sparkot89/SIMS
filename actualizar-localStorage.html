<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar SIMS - localStorage</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
        }
        .control-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        input[type="number"] {
            font-size: 20px;
            text-align: center;
        }
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-set {
            background: #667eea;
            color: white;
        }
        .btn-set:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        .btn-modify {
            background: #48bb78;
            color: white;
        }
        .btn-modify:hover {
            background: #38a169;
            transform: translateY(-2px);
        }
        .btn-reset {
            background: #f56565;
            color: white;
            grid-column: 1 / -1;
        }
        .btn-reset:hover {
            background: #e53e3e;
            transform: translateY(-2px);
        }
        .current-value {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
            padding: 15px;
            background: #f7fafc;
            border-radius: 8px;
        }
        .status {
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            font-weight: bold;
        }
        .status.success {
            background: #c6f6d5;
            color: #22543d;
        }
        .status.error {
            background: #fed7d7;
            color: #742a2a;
        }
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 20px;
        }
        .quick-btn {
            padding: 10px;
            background: #edf2f7;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .quick-btn:hover {
            background: #e2e8f0;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Control SIMS</h1>
        
        <div class="control-group">
            <label for="need-select">Selecciona Necesidad:</label>
            <select id="need-select" onchange="updateCurrentValue()">
                <option value="hambre">🍔 Hambre</option>
                <option value="energia">⚡ Energía</option>
                <option value="diversion">🎮 Diversión</option>
                <option value="social">👥 Social</option>
                <option value="higiene">🚿 Higiene</option>
                <option value="mental">🚽 mental</option>
                <option value="ambiente">🏠 Ambiente</option>
                <option value="confort">🛋️ Confort</option>
            </select>
        </div>

        <div class="current-value" id="current-value">
            Valor actual: 100%
        </div>

        <div class="control-group">
            <label for="value-input">Nuevo Valor (0-100):</label>
            <input type="number" id="value-input" min="0" max="100" value="50">
        </div>

        <div class="button-group">
            <button class="btn-set" onclick="setNeedValue()">Establecer Valor</button>
            <button class="btn-modify" onclick="modifyNeed(10)">+10</button>
            <button class="btn-modify" onclick="modifyNeed(-10)">-10</button>
            <button class="btn-modify" onclick="modifyNeed(25)">+25</button>
            <button class="btn-reset" onclick="resetAllNeeds()">🔄 Resetear Todo al 100%</button>
        </div>

        <div class="quick-actions">
            <button class="quick-btn" onclick="quickSet(0)">0%</button>
            <button class="quick-btn" onclick="quickSet(25)">25%</button>
            <button class="quick-btn" onclick="quickSet(50)">50%</button>
            <button class="quick-btn" onclick="quickSet(75)">75%</button>
            <button class="quick-btn" onclick="quickSet(100)">100%</button>
            <button class="quick-btn" onclick="modifyNeed(-25)">-25</button>
            <button class="quick-btn" onclick="modifyNeed(5)">+5</button>
            <button class="quick-btn" onclick="modifyNeed(-5)">-5</button>
        </div>

        <div id="status"></div>
    </div>

    <script>
        const STORAGE_KEY = 'sims_needs';

        function getNeeds() {
            const stored = localStorage.getItem(STORAGE_KEY);
            return stored ? JSON.parse(stored) : {};
        }

        function saveNeeds(needsData) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(needsData));
        }

        function getCurrentNeed() {
            return document.getElementById('need-select').value;
        }

        function updateCurrentValue() {
            const need = getCurrentNeed();
            const needs = getNeeds();
            const value = needs[need] || 100;
            document.getElementById('current-value').textContent = `Valor actual: ${value}%`;
        }

        function showStatus(message, isSuccess = true) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + (isSuccess ? 'success' : 'error');
            setTimeout(() => {
                status.textContent = '';
                status.className = 'status';
            }, 3000);
        }

        function setNeedValue() {
            const need = getCurrentNeed();
            const value = parseInt(document.getElementById('value-input').value);
            
            if (value < 0 || value > 100) {
                showStatus('❌ El valor debe estar entre 0 y 100', false);
                return;
            }

            const needs = getNeeds();
            needs[need] = value;
            saveNeeds(needs);
            
            updateCurrentValue();
            showStatus(`✅ ${need} establecido a ${value}%`);
        }

        function modifyNeed(amount) {
            const need = getCurrentNeed();
            const needs = getNeeds();
            const currentValue = needs[need] || 100;
            const newValue = Math.max(0, Math.min(100, currentValue + amount));
            
            needs[need] = newValue;
            saveNeeds(needs);
            
            updateCurrentValue();
            const symbol = amount > 0 ? '+' : '';
            showStatus(`✅ ${need}: ${currentValue}% → ${newValue}% (${symbol}${amount})`);
        }

        function quickSet(value) {
            document.getElementById('value-input').value = value;
            setNeedValue();
        }

        function resetAllNeeds() {
            if (confirm('¿Resetear todas las necesidades al 100%?')) {
                const needs = {
                    hambre: 100,
                    energia: 100,
                    diversion: 100,
                    social: 100,
                    higiene: 100,
                    mental: 100,
                    ambiente: 100,
                    confort: 100
                };
                saveNeeds(needs);
                updateCurrentValue();
                showStatus('✅ Todas las necesidades reseteadas al 100%');
            }
        }

        // Actualizar valor inicial al cargar
        updateCurrentValue();

        // Actualizar cuando cambie desde otra pestaña
        window.addEventListener('storage', (e) => {
            if (e.key === STORAGE_KEY) {
                updateCurrentValue();
            }
        });
    </script>
</body>
</html>
